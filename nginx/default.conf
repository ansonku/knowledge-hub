map $request_method $vue_page {
    GET /index.html;
    HEAD /index.html;
    default /__django_form__;
}

# Public entry pages (/articles/...) send their <title> and meta tags in X-Hub-Head; Django
# escapes them to ASCII. Every other request for index.html keeps the default title.
map $upstream_http_x_hub_head $hub_head {
    "" "<title>Knowledge Hub</title>";
    default $upstream_http_x_hub_head;
}

map $http_x_forwarded_proto $hub_proxy_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;

    proxy_set_header X-Forwarded-Proto $hub_proxy_scheme;
    proxy_set_header X-Hub-Client-IP $remote_addr;
    proxy_set_header Host $http_host;

    # `/` is decided by Django: members go to /app/, visitors to /articles/.
    location = / {
        proxy_pass $backend;
    }

    location ~ "^/accounts/manage/(?:[0-9a-f-]{36}/)?$" {
        try_files $vue_page @django;
    }

    location @django {
        proxy_pass $backend;
    }

    location ~ ^/accounts(/|$) {
        access_log off;
        error_log /dev/null;
        proxy_pass $backend;
    }

    location ^~ /api/documents/ {
        client_max_body_size 51m;
        # Videos embedded in Markdown: up to VIDEO_MAX_BYTES (200 MB). nginx takes the whole body before Django
        # sees it, so a slow upload never holds a gunicorn worker.
        location ~ "^/api/documents/[0-9a-f-]{36}/videos/$" {
            client_max_body_size 201m;
            proxy_pass $backend;
        }
        proxy_pass $backend;
    }

    # Django answers /api/videos/<id>/ with X-Accel-Redirect after checking access; only that redirect reaches here.
    # nginx handles Range requests, so players can seek.
    location ^~ /_protected/videos/ {
        internal;
        alias /var/lib/knowledge-hub/videos/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Vary "Cookie" always;
    }

    location ^~ /preview/ {
        access_log off;
        error_log /dev/null;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $hub_proxy_scheme;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_pass $backend;
    }

    location ~ ^/api(/|$) {
        proxy_pass $backend;
    }

    location = /markdown-diagram.html {
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location ^~ /articles/ {
        add_header Cache-Control "no-store" always;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_intercept_errors on;
        error_page 404 /index.html;
        proxy_pass $backend;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        sub_filter '<title>Knowledge Hub</title>' $hub_head;
        sub_filter_once on;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
