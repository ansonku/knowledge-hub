map $request_method $vue_page {
    GET /index.html;
    HEAD /index.html;
    default /__django_form__;
}

map $http_x_forwarded_proto $hub_proxy_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8000;

    proxy_set_header X-Forwarded-Proto $hub_proxy_scheme;
    proxy_set_header X-Hub-Client-IP $remote_addr;
    proxy_set_header Host $http_host;

    location = /accounts/profile/ {
        try_files $vue_page @django;
    }

    location ~ "^/accounts/manage/(?:[0-9a-f-]{36}/)?$" {
        try_files $vue_page @django;
    }

    location @django {
        proxy_pass $backend;
    }

    location ~ ^/accounts(/|$) {
        access_log off;
        error_log /dev/null;
        proxy_pass $backend;
    }

    location ~ ^/(api|preview)(/|$) {
        proxy_pass $backend;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
