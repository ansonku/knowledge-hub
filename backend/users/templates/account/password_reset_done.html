{% extends "allauth/layouts/credentials.html" %}
{% block head_title %}查看電子郵件 · Knowledge Hub{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="sent-title">
  <h1 id="sent-title">查看電子郵件</h1>
  <p class="login-description">如果這個電子郵件已註冊，你會收到一封含有密碼重設連結的郵件。也可以查看垃圾郵件匣。</p>
  <p class="login-return"><a href="{% url 'account_login' %}">返回登入</a></p>
</section>
{% endblock %}
