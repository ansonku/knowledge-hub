{% extends "allauth/layouts/base.html" %}
{% block head_title %}個人設定 · Knowledge Hub{% endblock %}
{% block content %}
<h1>個人設定</h1>
<dl>
  <dt>電子郵件</dt><dd>{{ user.email }}</dd>
  <dt>角色</dt><dd>{{ user.get_role_display }}</dd>
</dl>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">儲存顯示名稱</button>
</form>
<ul>
  <li><a href="{% url 'account_change_password' %}">變更密碼</a></li>
  <li><a href="{% url 'socialaccount_connections' %}">Google 帳號綁定</a></li>
  <li><a href="{% url 'mfa_index' %}">雙因素驗證</a></li>
</ul>
{% endblock %}
