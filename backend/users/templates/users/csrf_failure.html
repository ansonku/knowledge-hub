{% extends "allauth/layouts/credentials.html" %}
{% block head_title %}表單驗證失敗 · {{ site_name }}{% endblock %}
{% block content %}
<section class="login-card" aria-labelledby="csrf-title">
  <h1 id="csrf-title">表單驗證失敗</h1>
  <p class="login-description">請重新開啟表單再送出，並確認瀏覽器允許此站台的 Cookie。</p>
  {% if request.path == '/accounts/login/' %}
    <p class="login-return"><a href="{% url 'account_login' %}">重新開啟登入頁</a></p>
  {% else %}
    <p class="login-return"><a href="/">回首頁</a></p>
  {% endif %}
</section>
{% endblock %}
