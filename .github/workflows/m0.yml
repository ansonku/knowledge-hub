name: Knowledge Hub checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/init-env.sh
      - run: docker compose up --build --wait
      - run: docker compose exec -T backend ruff check .
      - run: docker compose exec -T backend python manage.py makemigrations --check --dry-run
      - run: docker compose exec -T backend python manage.py test
      - run: bash scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
